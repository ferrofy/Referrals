<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FerroFy Referrals</title>
    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="shortcut icon" href="Images/Favicon.png" type="image/x-icon">
</head>

<body>
    <header>
        <h1>FerroFy Referrals</h1>
    </header>

    <main>
        <div class="Img_Logo_Social">
            <img src="Images/Logo.png" alt="FFy Logo">
            <H2>FerroFy</H2>
            <div class="Social">
                <!-- <i class="fa-brands fa-instagram"></i> -->
                <!-- <i class="fa-brands fa-github"></i> -->
            </div>
        </div>

        <div class="Referral">
            <ul>
                <li>
                    <h1>Grass</h1>
                    <div class="Link" id="Grass_Link" onClick="Copy(`Grass`)"></div>
                </li>
                <li>
                    <h1>GoSats</h1>
                    <div class="Link" id="GoSats_Link" onClick="Copy(`GoSats`)"></div>
                </li>
                <li>
                    <h1>BixBerry</h1>
                    <div class="Link" id="BixBerry_Link" onClick="Copy(`BixBerry`)"></div>
                </li>
            </ul>
        </div>
    </main>
    <script src="JS.js"></script>
</body>

</html>
